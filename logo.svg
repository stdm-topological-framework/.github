<svg xmlns="http://w3.org" viewBox="0 0 500 500" width="500" height="500">
  <!-- Глубокий научно-синий фон -->
  <rect width="100%" height="100%" fill="#0d1b2a"/>
  
  <!-- Золотая орбита (символ космологии и топологии) -->
  <circle cx="250" cy="250" r="180" fill="none" stroke="#e0a96d" stroke-width="4" stroke-dasharray="10 5"/>
  <circle cx="250" cy="250" r="160" fill="none" stroke="#e0a96d" stroke-width="2"/>
  
  <!-- Строгий белый текст -->
  <text x="50%" y="55%" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="75" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="4">ICSR</text>
</svg>